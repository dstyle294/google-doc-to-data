<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REU Hours Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>REU 400-Hour Tracker</h1>
      <p class="subtitle">Fall 2025 + Winter 2026 + Spring 2026 progress</p>
      <p id="dataStatus" class="subtitle"></p>

      <section class="card metrics">
        <div><h2>Total</h2><p id="totalHours">0h</p></div>
        <div><h2>Remaining</h2><p id="remainingHours">400h</p></div>
        <div><h2>Goal Progress</h2><p id="goalPct">0%</p></div>
      </section>

      <section class="card">
        <h2>Term Totals</h2>
        <ul id="termTotals"></ul>
      </section>

      <section class="card">
        <h2>Top Tasks By Hours</h2>
        <ol id="taskList"></ol>
      </section>

      <section class="card">
        <h2>What to do next</h2>
        <p id="nextAction"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
